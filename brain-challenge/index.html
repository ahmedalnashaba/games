<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Brain Challenge</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{margin:0;font-family:'Fredoka',system-ui,sans-serif;background:#141832;min-height:100vh;color:#fff}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 20% 10%,#3b2d8f55,transparent 50%),radial-gradient(circle at 90% 80%,#0f8b8d44,transparent 50%);pointer-events:none}
.wrap{max-width:560px;margin:0 auto;padding:16px 14px 40px;position:relative}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
h1{font-size:26px;margin:0;font-weight:700}
.pill{background:#ffffff14;border:1px solid #ffffff22;border-radius:999px;padding:6px 12px;font-size:17px;font-weight:600;cursor:pointer;color:#fff;font-family:inherit}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{border:none;border-radius:22px;padding:16px 10px;font-family:inherit;font-size:18px;font-weight:700;color:#fff;cursor:pointer;box-shadow:0 6px 0 #0005;text-align:center}
.card:active{transform:translateY(4px);box-shadow:0 2px 0 #0005}
.card .e{font-size:40px;display:block}
.card small{display:block;font-weight:500;font-size:13px;opacity:.85;margin-top:2px}
.c1{background:linear-gradient(135deg,#7b6cf6,#5a4bd1)}.c2{background:linear-gradient(135deg,#f15bb5,#c2338b)}.c3{background:linear-gradient(135deg,#2ec4b6,#14897f)}
.c4{background:linear-gradient(135deg,#ff8c42,#d9601a)}.c5{background:linear-gradient(135deg,#3a86ff,#1d5fd1)}.c6{background:linear-gradient(135deg,#9b5de5,#6a2fb5)}
.panel{background:#fff;color:#1d1f3a;border-radius:26px;padding:16px;text-align:center}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:6px}
.back{border:none;background:#eef;border-radius:12px;padding:7px 12px;font-family:inherit;font-size:16px;font-weight:600;cursor:pointer}
.say{border:none;background:#ffe9a8;border-radius:12px;padding:7px 12px;font-size:18px;cursor:pointer}
.lvl{font-weight:700;color:#5a4bd1;font-size:15px}
.prog{height:9px;background:#eee;border-radius:9px;overflow:hidden;margin-bottom:10px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#7b6cf6,#f15bb5);transition:width .3s}
.q{font-size:20px;font-weight:700;margin:4px 0 12px;line-height:1.35}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.opts.two{grid-template-columns:repeat(2,1fr)}
.opt{border:3px solid transparent;background:#f3f1ff;border-radius:16px;padding:6px;cursor:pointer;font-family:inherit;font-size:30px;font-weight:700;color:#1d1f3a;min-height:64px;display:flex;align-items:center;justify-content:center}
.opt svg{width:100%;height:auto;max-width:110px}
.opt.good{background:#c9f7d6;border-color:#22b35e}.opt.bad{background:#ffd0d0;border-color:#e04848}
.matrix{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:300px;margin:0 auto 14px;background:#e6e4f7;padding:6px;border-radius:16px}
.matrix div{background:#fff;border-radius:10px;aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.matrix svg{width:92%;height:92%}
.matrix .miss{border:3px dashed #7b6cf6;font-size:34px;color:#7b6cf6;font-weight:700}
.seq{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:14px}
.seq span{background:#f3f1ff;border-radius:12px;padding:8px 12px;font-size:28px;font-weight:700;min-width:54px}
.seq .miss{border:3px dashed #7b6cf6;color:#7b6cf6}
.eq{font-size:34px;margin:4px 0;letter-spacing:2px}
.eq b{color:#5a4bd1;margin:0 8px}
.target{width:150px;margin:0 auto 12px;background:#f7f6ff;border-radius:16px;padding:8px}
.pads{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:320px;margin:0 auto}
.pad{aspect-ratio:1;border-radius:20px;border:none;cursor:pointer;opacity:.35;transition:opacity .12s,transform .12s}
.pad.lit{opacity:1;transform:scale(1.06);box-shadow:0 0 22px currentColor}
.fb{font-size:22px;font-weight:700;min-height:34px;margin-top:10px}
.big{border:none;background:#5a4bd1;color:#fff;border-radius:16px;padding:12px 26px;font-family:inherit;font-size:20px;font-weight:700;margin-top:10px;cursor:pointer;box-shadow:0 5px 0 #0003}
.tip{background:#ffffff12;border-radius:16px;padding:12px 14px;margin-top:14px;font-size:15px;line-height:1.6;color:#dfe0ff}
.hidden{display:none}
.player{display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:10px;font-size:18px}
.player button{border:none;background:#ffffff22;color:#fff;border-radius:10px;padding:4px 10px;font-family:inherit;font-size:14px;cursor:pointer}
.hstabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:10px;background:#f0eefc;padding:4px;border-radius:14px}
.hstabs button{border:none;background:transparent;border-radius:10px;padding:8px 2px;font-family:inherit;font-weight:700;font-size:14px;cursor:pointer;color:#1d1f3a}
.hstabs button.sel{background:#fff;box-shadow:0 2px 0 #0002}
tr.me td{background:#fff3c4}
.sgrid{display:grid;margin:0 auto;border:0 solid #1d1f3a}
.scell{aspect-ratio:1;border:solid #1d1f3a;background:#fff;font-size:28px;cursor:pointer;padding:0;border-color:#1d1f3a;outline:1px solid #ccc;outline-offset:-1px}
.scell.empty{background:#f3f1ff}.scell.sel{background:#ffe9a8}
.cboard{display:flex;flex-direction:column;gap:6px;align-items:center;margin-bottom:10px}
.crow{display:flex;gap:6px;align-items:center;background:#f7f6ff;border-radius:12px;padding:6px 10px}
.crow.cur{background:#ece9ff}.cslot{border:none;background:none;padding:0;cursor:pointer}
.fbk{margin-left:8px;font-size:13px;letter-spacing:1px;min-width:70px;text-align:left}
.cpal{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.cpick{border:none;background:none;cursor:pointer;padding:2px}
.pgrid{display:grid;gap:6px;margin:0 auto}
.hsbtn{width:100%;margin-top:12px;border:none;border-radius:18px;padding:14px;font-family:inherit;font-size:19px;font-weight:700;color:#1d1f3a;background:linear-gradient(135deg,#ffd166,#ffb703);cursor:pointer;box-shadow:0 5px 0 #0004}
table.hs{width:100%;border-collapse:collapse;font-size:15px}table.hs td,table.hs th{padding:7px 4px;border-bottom:1px solid #eee}table.hs th{color:#5a4bd1}
.namein{font-family:inherit;font-size:20px;padding:10px 14px;border-radius:14px;border:3px solid #7b6cf6;width:70%;text-align:center;margin-top:8px}
.diff{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px;background:#ffffff10;padding:6px;border-radius:18px}
.diff button{border:none;border-radius:13px;padding:10px 2px;font-family:inherit;font-size:15px;font-weight:700;background:transparent;color:#fff;cursor:pointer}
.diff button.sel{background:#fff;color:#1d1f3a;box-shadow:0 3px 0 #0003}
.timer{height:6px;background:#eee;border-radius:6px;overflow:hidden;margin:-4px 0 10px}
.timer i{display:block;height:100%;background:#e63946;width:100%}
.confetti{position:fixed;font-size:28px;pointer-events:none;animation:fall 1.4s ease-in forwards;z-index:9}
@keyframes fall{to{transform:translateY(80vh) rotate(360deg);opacity:0}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🧠 Brain Challenge</h1>
    <div style="display:flex;gap:6px"><button class="pill" id="mute">🔊</button><div class="pill">⭐ <span id="stars">0</span></div></div>
  </header>

  <div id="namescr" class="hidden">
    <div class="panel" style="padding:28px 18px">
      <div style="font-size:64px">👋</div>
      <div class="q">Welcome to Brain Challenge!<br>What's your name?</div>
      <input class="namein" id="nameinput" maxlength="14" placeholder="Your name" autocomplete="off">
      <br><button class="big" id="namego">Let's go! 🚀</button>
      <div class="fb" id="namefb" style="font-size:16px;color:#e63946"></div>
    </div>
  </div>

  <div id="home" class="hidden">
    <div class="player">👤 <b id="pname"></b><button id="pchange">Change</button></div>
    <div class="diff" id="diff">
      <button data-d="0">🟢 Easy</button><button data-d="1">🟡 Medium</button><button data-d="2">🟠 Pro</button><button data-d="3">🔴 Extreme</button>
    </div>
    <div class="menu">
      <button class="card c1" data-g="matrix"><span class="e">🔳</span>Matrix Puzzles<small>Find the missing piece</small></button>
      <button class="card c2" data-g="rotate"><span class="e">🔄</span>Shape Rotation<small>Turned, not flipped</small></button>
      <button class="card c3" data-g="numbers"><span class="e">🔢</span>Number Patterns<small>What comes next?</small></button>
      <button class="card c4" data-g="balance"><span class="e">⚖️</span>Balance Scale<small>Logic &amp; weights</small></button>
      <button class="card c5" data-g="simon"><span class="e">💡</span>Memory Lights<small>Repeat the pattern</small></button>
      <button class="card c3" data-g="cube"><span class="e">🧊</span>Cube Count<small>Count hidden cubes</small></button>
      <button class="card c1" data-g="analogy"><span class="e">🔀</span>Shape Analogies<small>This is to that as…</small></button>
      <button class="card c4" data-g="sudoku"><span class="e">🧩</span>Picture Sudoku<small>Fill the grid</small></button>
      <button class="card c2" data-g="code"><span class="e">🔐</span>Code Breaker<small>Crack the secret code</small></button>
      <button class="card c5" data-g="odd"><span class="e">🕵️</span>Odd One Out<small>Find the rule breaker</small></button>
      <button class="card c3" data-g="math"><span class="e">⚡</span>Quick Math<small>Mental math chains</small></button>
      <button class="card c4" data-g="path"><span class="e">🤖</span>Robot Path<small>Follow the arrows</small></button>
      <button class="card c6" data-g="mix"><span class="e">🏆</span>IQ Test Mix<small>All types, 15 questions</small></button>
    </div>
    <button class="hsbtn" id="hsbtn">🏆 High Scores</button>
    <div class="tip" id="dtip"></div>
  </div>

  <div id="game" class="hidden">
    <div class="panel">
      <div class="top"><button class="back" id="back">← Back</button><span class="lvl" id="lvl"></span><button class="say" id="say">🔊</button></div>
      <div class="prog"><i id="bar"></i></div><div class="timer hidden" id="timer"><i id="tbar"></i></div>
      <div id="stage"></div>
      <div class="fb" id="fb"></div>
    </div>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
const R=n=>Math.floor(Math.random()*n);
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=R(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=(a,n)=>shuf(a).slice(0,n);

/* ---------- stars, sound, voice ---------- */
let stars=0,muted=false;try{stars=+localStorage.getItem('bcStars')||0}catch(e){}
const showStars=()=>{$('#stars').textContent=stars;try{localStorage.setItem('bcStars',stars)}catch(e){}};showStars();

const yay=()=>{beep(660);setTimeout(()=>beep(880),110);setTimeout(()=>beep(1175,.25),220)};
const nope=()=>beep(180,.3,'triangle');
let voice=null;
function loadVoice(){try{const v=speechSynthesis.getVoices();voice=v.find(x=>/en-US/.test(x.lang)&&/Samantha|Google|Female|Aria|Jenny/i.test(x.name))||v.find(x=>/^en/.test(x.lang))||null}catch(e){}}

let lastSay='',curAudio=null;
function stopSay(){try{speechSynthesis.cancel()}catch(e){}if(curAudio){curAudio.pause();curAudio=null}}
function say(k,keep=true){if(keep)lastSay=k;if(muted)return;stopSay();
  if(VOICE[k]){try{curAudio=new Audio(VOICE[k]);curAudio.play().catch(()=>{})}catch(e){}return}
  try{const u=new SpeechSynthesisUtterance(LINES[k]||k);u.lang='en-US';u.rate=.95;u.pitch=1.05;if(voice)u.voice=voice;speechSynthesis.speak(u)}catch(e){}}
$('#say').onclick=()=>say(lastSay);
$('#mute').onclick=()=>{muted=!muted;$('#mute').textContent=muted?'🔇':'🔊';if(muted)stopSay()};
function confetti(){for(let i=0;i<14;i++){const s=document.createElement('div');s.className='confetti';s.textContent=['⭐','🎉','✨','🧠'][R(4)];s.style.left=R(95)+'vw';s.style.top='-20px';s.style.animationDelay=(Math.random()*.4)+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),2000)}}
const PRAISE=['p1','p2','p3','p4','p5','p6'];

/* ---------- game flow ---------- */
let G,qi,lvl,correct,locked,TOTAL,curType,tmr=null;
const DIFFS=[{n:'Easy',min:1,max:2,t:0,tip:'🟢 Easy: simple patterns, short sequences, 4 choices.'},
 {n:'Medium',min:3,max:4,t:0,tip:'🟡 Medium: two rules at once, bigger shapes, longer memory chains.'},
 {n:'Pro',min:5,max:6,t:0,tip:'🟠 Pro: three rules at once, Fibonacci-style numbers, 6 choices, fast lights.'},
 {n:'Extreme',min:7,max:8,t:25,tip:'🔴 Extreme: adult IQ-test difficulty, every rule mixed, and only 25 seconds per question!'}];
let D=0;try{D=+localStorage.getItem('bcDiff')||0}catch(e){}
function setDiff(d){D=d;try{localStorage.setItem('bcDiff',d)}catch(e){}document.querySelectorAll('#diff button').forEach(b=>b.classList.toggle('sel',+b.dataset.d===d));$('#dtip').innerHTML=DIFFS[d].tip+'<br>Inside each level it adapts: right answers make it harder, mistakes make it a bit easier.'}
document.querySelectorAll('#diff button').forEach(b=>b.onclick=()=>{setDiff(+b.dataset.d);beep(520,.08);say('pick_level',false)});

/* ---------- SVG helpers ---------- */
const COLORS=['#e63946','#2a9d8f','#f4a100','#5a4bd1','#1d1f3a'];
const SHAPES=['circle','square','triangle','diamond','star'];
function shapeSVG(type,cx,cy,r,col,fill=true){
  const f=fill?col:'none',st=`stroke="${col}" stroke-width="3" fill="${f}"`;
  if(type==='circle')return `<circle cx="${cx}" cy="${cy}" r="${r}" ${st}/>`;
  if(type==='square')return `<rect x="${cx-r*.9}" y="${cy-r*.9}" width="${r*1.8}" height="${r*1.8}" rx="2" ${st}/>`;
  if(type==='triangle')return `<polygon points="${cx},${cy-r} ${cx+r},${cy+r*.85} ${cx-r},${cy+r*.85}" ${st}/>`;
  if(type==='diamond')return `<polygon points="${cx},${cy-r*1.1} ${cx+r},${cy} ${cx},${cy+r*1.1} ${cx-r},${cy}" ${st}/>`;
  let p=[];for(let i=0;i<10;i++){const a=Math.PI/5*i-Math.PI/2,rr=i%2?r*.45:r*1.1;p.push((cx+rr*Math.cos(a)).toFixed(1)+','+(cy+rr*Math.sin(a)).toFixed(1))}
  return `<polygon points="${p.join(' ')}" ${st}/>`;
}
function cellSVG(c){ // c={shape,color,count,fill}
  const pos={1:[[50,50]],2:[[30,50],[70,50]],3:[[50,27],[28,70],[72,70]],4:[[30,30],[70,30],[30,70],[70,70]]}[Math.max(1,Math.min(4,c.count))];
  const r=(c.count===1?24:c.count===2?16:14)*(c.size||1);
  return `<svg viewBox="0 0 100 100">${pos.map(([x,y])=>shapeSVG(c.shape,x,y,r,c.color,c.fill)).join('')}</svg>`;
}

/* ---------- 1. MATRIX (Raven style) ---------- */
const RULES={
  const:()=>0, row:(r,c)=>r, col:(r,c)=>c, latA:(r,c)=>(r+c)%3, latB:(r,c)=>(r+2*c)%3
};
const MATRIX_PLAN=[
  {shape:'row',color:'col',count:'const',fill:'const'},
  {shape:'row',color:'const',count:'col',fill:'const'},
  {shape:'latA',color:'row',count:'const',fill:'const'},
  {shape:'latA',color:'const',count:'col',fill:'row'},
  {shape:'latA',color:'latB',count:'col',fill:'const'},
  {shape:'latB',color:'latA',count:'row',fill:'col'},
  {shape:'latA',color:'latB',count:'latB',fill:'const'},
  {shape:'latB',color:'latA',count:'latA',fill:'latB'}
];
function GAME_matrix(){
  const plan=MATRIX_PLAN[Math.min(lvl,MATRIX_PLAN.length)-1];
  const vals={shape:pick(SHAPES,3),color:pick(COLORS,3),count:shuf([1,2,3]),fill:shuf([true,false,true]).slice(0,3)};
  if(plan.fill!=='const')vals.fill=shuf([true,false,true]); // two kinds only
  if(plan.fill==='const')vals.fill=[true,true,true];
  if(plan.count==='const'){const c=1+R(2);vals.count=[c,c,c]}
  const keys=['shape','color','count','fill'];
  const cell=(r,c)=>{const o={};keys.forEach(k=>o[k]=vals[k][RULES[plan[k]](r,c)]);return o};
  const ans=cell(2,2);const id=o=>keys.map(k=>o[k]).join('|');
  // distractors
  const alt={shape:[...new Set([...vals.shape,...pick(SHAPES,2)])],color:[...new Set([...vals.color,COLORS[R(5)]])],count:[1,2,3],fill:[true,false]};
  const cands=new Map();
  const varying=keys.filter(k=>plan[k]!=='const');
  const order=[...shuf(varying),...shuf(keys.filter(k=>!varying.includes(k)))];
  for(const k of order)for(const v of shuf(alt[k])){const o={...ans,[k]:v};if(id(o)!==id(ans))cands.set(id(o),o)}
  for(let i=0;i<30&&cands.size<12;i++){const [a,b]=pick(keys,2);const o={...ans,[a]:alt[a][R(alt[a].length)],[b]:alt[b][R(alt[b].length)]};if(id(o)!==id(ans))cands.set(id(o),o)}
  // prefer distractors that look like cells in the grid (tempting)
  const gridIds=new Set();for(let r=0;r<3;r++)for(let c=0;c<3;c++)if(r+c<4)gridIds.add(id(cell(r,c)));
  let pool=[...cands.values()];
  const tempting=shuf(pool.filter(o=>gridIds.has(id(o)))).slice(0,2);
  const rest=shuf(pool.filter(o=>!tempting.includes(o)));
  const n=lvl<3?4:6;
  const options=shuf([ans,...tempting,...rest].slice(0,n));
  const ai=options.findIndex(o=>id(o)===id(ans));
  let grid='';for(let r=0;r<3;r++)for(let c=0;c<3;c++)grid+=(r===2&&c===2)?'<div class="miss">?</div>':`<div>${cellSVG(cell(r,c))}</div>`;
  $('#stage').innerHTML=`<div class="q">Which piece completes the pattern?</div><div class="matrix">${grid}</div><div class="opts ${n===4?'two':''}">${options.map(o=>`<button class="opt">${cellSVG(o)}</button>`).join('')}</div>`;
  say('matrix_q');
  bindOpts(ai,'Check the rows and columns.');
}

/* ---------- 2. MENTAL ROTATION ---------- */
const norm=p=>{const mx=Math.min(...p.map(a=>a[0])),my=Math.min(...p.map(a=>a[1]));return p.map(([x,y])=>[x-mx,y-my]).sort((a,b)=>a[0]-b[0]||a[1]-b[1])};
const key=p=>norm(p).map(a=>a.join(',')).join(';');
const rot=p=>p.map(([x,y])=>[-y,x]);
const mir=p=>p.map(([x,y])=>[-x,y]);
const rotN=(p,n)=>{for(let i=0;i<n;i++)p=rot(p);return p};
function poly(n){
  const s=[[0,0]];const has=(x,y)=>s.some(a=>a[0]===x&&a[1]===y);
  while(s.length<n){const [x,y]=s[R(s.length)];const [dx,dy]=[[1,0],[-1,0],[0,1],[0,-1]][R(4)];if(!has(x+dx,y+dy))s.push([x+dx,y+dy])}
  return s;
}
function polySVG(p,col){
  p=norm(p);const w=Math.max(...p.map(a=>a[0]))+1,h=Math.max(...p.map(a=>a[1]))+1,S=Math.max(w,h);
  const u=90/S,ox=5+(S-w)*u/2,oy=5+(S-h)*u/2;
  return `<svg viewBox="0 0 100 100">${p.map(([x,y])=>`<rect x="${ox+x*u}" y="${oy+y*u}" width="${u}" height="${u}" fill="${col}" stroke="#fff" stroke-width="2.5" rx="3"/>`).join('')}</svg>`;
}
function GAME_rotate(){
  const size=Math.min(4+Math.floor((lvl-1)/2),8);
  let p,ok=false;
  for(let t=0;t<500&&!ok;t++){
    p=poly(size);
    const rots=new Set([0,1,2,3].map(k=>key(rotN(p,k))));
    const mirs=new Set([0,1,2,3].map(k=>key(rotN(mir(p),k))));
    ok=[...rots].every(k=>!mirs.has(k))&&mirs.size>=3&&rots.size>=3;
  }
  const tk=R(4),target=rotN(p,tk);
  const ck=(tk+1+R(3))%4,ansP=rotN(p,ck);
  const n=lvl<3?3:4;
  const ms=[];const seen=new Set();for(const k of shuf([0,1,2,3])){const m=rotN(mir(p),k);if(!seen.has(key(m))){seen.add(key(m));ms.push(m)}}
  const options=shuf([ansP,...ms.slice(0,n-1)]);const ai=options.indexOf(ansP);
  const col=['#5a4bd1','#e63946','#2a9d8f','#f4a100'][R(4)];
  $('#stage').innerHTML=`<div class="q">Which one is the SAME shape, just turned around?<br><span style="font-size:15px;color:#888">(Flipped like a mirror doesn't count!)</span></div><div class="target">${polySVG(target,'#1d1f3a')}</div><div class="opts ${n===4?'two':''}">${options.map(o=>`<button class="opt">${polySVG(o,col)}</button>`).join('')}</div>`;
  say('rotate_q');
  bindOpts(ai,'The others are mirror images.');
}

/* ---------- 3. NUMBER PATTERNS ---------- */
function seqGen(){
  const L=lvl,a=2+R(4),b=1+R(3),s=1+R(9);
  const gens=[
    [1,()=>{const d=2+R(4);return{t:[0,1,2,3,4].map(i=>s+d*i),r:`Add ${d} each time.`}}],
    [2,()=>{const d=2+R(3),st=20+R(15);return{t:[0,1,2,3,4].map(i=>st-d*i),r:`Take away ${d} each time.`}}],
    [2,()=>({t:[0,1,2,3,4].map(i=>b*2**i),r:'Double it each time.'})],
    [3,()=>{const t=[s];for(let i=1;i<6;i++)t.push(t[i-1]+(i%2?a:b));return{t,r:`Add ${a}, then add ${b}, again and again.`}}],
    [3,()=>{const t=[s];for(let i=1;i<6;i++)t.push(t[i-1]+i);return{t,r:'Add 1, then 2, then 3, then 4...'}}],
    [4,()=>{const t=[s];for(let i=1;i<6;i++)t.push(i%2?t[i-1]+a:t[i-1]-b);return{t,r:`Add ${a}, then take away ${b}.`}}],
    [4,()=>({t:[1,2,3,4,5,6].map(i=>i*i),r:'1×1, 2×2, 3×3, 4×4...'})],
    [5,()=>{const t=[1,1+R(2)];for(let i=2;i<7;i++)t.push(t[i-1]+t[i-2]);return{t,r:'Add the two numbers before it.'}}],
    [5,()=>({t:[s,20,s+a,20-b,s+2*a,20-2*b],r:'Two patterns mixed: look at every other number.'})],
    [6,()=>{const t=[1+R(2)];for(let i=1;i<5;i++)t.push(t[i-1]*3);return{t,r:'Multiply by 3 each time.'}}],
    [6,()=>{const t=[2+R(2)];for(let i=1;i<6;i++)t.push(t[i-1]*2-1);return{t,r:'Double it, then take away 1.'}}],
    [7,()=>{const t=[s];let d=1;for(let i=1;i<6;i++){t.push(t[i-1]+d);d*=2}return{t,r:'The jumps double: +1, +2, +4, +8...'}}],
    [8,()=>({t:[2,3,5,7,11,13],r:'Prime numbers: only divide by 1 and themselves.'})]
  ];
  const ok=gens.filter(g=>g[0]<=L&&g[0]>=L-2);return ok[R(ok.length)][1]();
}
function GAME_numbers(){
  const {t,r}=seqGen();const shown=t.slice(0,-1),ans=t[t.length-1];
  const s=new Set([ans]);const near=[ans+1,ans-1,ans+2,ans-2,ans+(t[t.length-1]-t[t.length-2]),shown[shown.length-1]+ (shown[1]-shown[0]),ans*2,ans+10];
  for(const v of shuf(near)){if(s.size>=4)break;if(v>=0&&v!==ans)s.add(v)}
  const options=shuf([...s]);const ai=options.indexOf(ans);
  $('#stage').innerHTML=`<div class="q">What number comes next?</div><div class="seq">${shown.map(x=>`<span>${x}</span>`).join('')}<span class="miss">?</span></div><div class="opts two">${options.map(o=>`<button class="opt">${o}</button>`).join('')}</div>`;
  say('numbers_q');
  bindOpts(ai,`It's ${ans}. ${r}`);
}

/* ---------- 4. BALANCE SCALE ---------- */
const ITEMS=['🍎','🍌','🍉','🐱','🐘','⚽','🚗','🎁','🧸','🍩'];
function GAME_balance(){
  const it=pick(ITEMS,4);let eqs,qa,ans,why;
  if(lvl<=2){const m=2+R(lvl);const k=2+R(2);eqs=[[it[0],m,it[1],1]];ans=m*k;qa=`How many ${it[0]} weigh the same as ${k} ${it[1]}?`;why=`1 ${it[1]} = ${m} ${it[0]}, so ${k} of them = ${ans}.`;
    eqs.q=[it[1],k]}
  else if(lvl<=4){const m1=2+R(2),m2=2+R(lvl===3?1:2);eqs=[[it[0],m1,it[1],1],[it[1],m2,it[2],1]];ans=m1*m2;qa=`How many ${it[0]} weigh the same as one ${it[2]}?`;why=`${m2} × ${m1} = ${ans}.`;eqs.q=[it[2],1]}
  else if(lvl<=6){const m1=2,m2=2+R(2),m3=2;eqs=[[it[0],m1,it[1],1],[it[1],m2,it[2],1],[it[2],m3,it[3],1]];ans=m1*m2*m3;qa=`How many ${it[0]} weigh the same as one ${it[3]}?`;why=`${m1} × ${m2} × ${m3} = ${ans}.`;eqs.q=[it[3],1]}
  else if(Math.random()<.5){const m1=2+R(2),m2=2+R(2),m3=2;eqs=[[it[0],m1,it[1],1],[it[1],m2,it[2],1],[it[2],m3,it[3],1]];ans=m1*m2*m3;qa=`How many ${it[0]} weigh the same as one ${it[3]}?`;why=`${m1} × ${m2} × ${m3} = ${ans}.`}
  else{ // A + B = C ; C = 2B ; how many A = B
    const x=1+R(2);// B = x A ... C = 2B ; A+B=C => A = B
    eqs=null;ans=1;
    const html=`<div class="eq">${it[0]} ${it[1]}<b>=</b>${it[2]}</div><div class="eq">${it[1]} ${it[1]}<b>=</b>${it[2]}</div>`;
    qa=`How many ${it[0]} weigh the same as one ${it[1]}?`;why=`${it[0]} + ${it[1]} = ${it[1]} + ${it[1]}, so ${it[0]} = ${it[1]}.`;
    return renderBal(html,qa,ans,why);
  }
  const html=eqs.map(([a,m,b,n])=>`<div class="eq">${a.repeat(m)}<b>=</b>${b.repeat(n)}</div>`).join('');
  renderBal(html,qa,ans,why);
}
function renderBal(html,qa,ans,why){
  const s=new Set([ans]);for(const v of shuf([ans+1,ans-1,ans+2,ans*2,ans+3,Math.max(1,ans-2)])){if(s.size>=4)break;if(v>0)s.add(v)}
  const options=shuf([...s]);const ai=options.indexOf(ans);
  $('#stage').innerHTML=`<div class="q">⚖️ These weigh the same:</div><div style="background:#f7f6ff;border-radius:16px;padding:8px;margin-bottom:12px">${html}</div><div class="q">${qa}</div><div class="opts two">${options.map(o=>`<button class="opt">${o}</button>`).join('')}</div>`;
  say('balance_q');
  bindOpts(ai,why);
}

/* ---------- 6. CUBE COUNT (isometric) ---------- */
function GAME_cube(){
  const cfg=[[2,2],[2,3],[3,2],[3,3],[3,3],[3,4],[4,3],[4,4]][Math.min(lvl,8)-1];
  const N=cfg[0],H=cfg[1];
  // staircase heights: never taller toward the viewer, so every column top is visible
  const h=[];for(let i=0;i<N;i++){h.push([]);for(let j=0;j<N;j++){let m=H;if(i>0)m=Math.min(m,h[i-1][j]);if(j>0)m=Math.min(m,h[i][j-1]);h[i].push(i+j===0?Math.max(1,R(m+1)):R(m+1))}}
  if(h[0][0]<2&&H>=2)h[0][0]=2;
  let ans=0,cols=0;h.forEach(r=>r.forEach(v=>{ans+=v;if(v)cols++}));
  if(ans<3)return GAME_cube();
  const a=26,cx=150,cy=60+H*a;
  const P=(i,j,k)=>[cx+(i-j)*a*.87,cy+(i+j)*a*.5-k*a];
  const pts=arr=>arr.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ');
  const pal=['#7b6cf6','#2a9d8f','#f4a100','#e63946'][R(4)];
  let svg='';const cubes=[];
  for(let i=0;i<N;i++)for(let j=0;j<N;j++)for(let k=0;k<h[i][j];k++)cubes.push([i,j,k]);
  cubes.sort((p,q)=>(p[0]+p[1])-(q[0]+q[1])||p[2]-q[2]);
  for(const [i,j,k] of cubes){
    const top=[P(i,j,k+1),P(i+1,j,k+1),P(i+1,j+1,k+1),P(i,j+1,k+1)];
    const left=[P(i,j+1,k+1),P(i+1,j+1,k+1),P(i+1,j+1,k),P(i,j+1,k)];
    const right=[P(i+1,j,k+1),P(i+1,j+1,k+1),P(i+1,j+1,k),P(i+1,j,k)];
    svg+=`<polygon points="${pts(top)}" fill="#fff" stroke="#1d1f3a" stroke-width="1.5"/><polygon points="${pts(left)}" fill="${pal}" opacity=".55" stroke="#1d1f3a" stroke-width="1.5"/><polygon points="${pts(right)}" fill="${pal}" stroke="#1d1f3a" stroke-width="1.5"/>`;
  }
  const s=new Set([ans]);for(const v of shuf([ans-1,ans+1,ans-2,ans+2,cols,ans+3])){if(s.size>=4)break;if(v>0)s.add(v)}
  const options=shuf([...s]);const ai=options.indexOf(ans);
  const W=300,HH=cy+N*a+20;
  $('#stage').innerHTML=`<div class="q">How many cubes? 🧊<br><span style="font-size:15px;color:#888">Cubes can't float: count the hidden ones underneath too!</span></div><div style="background:#f7f6ff;border-radius:16px;margin-bottom:12px"><svg viewBox="0 0 ${W} ${HH}" style="width:100%;max-width:320px">${svg}</svg></div><div class="opts two">${options.map(o=>`<button class="opt">${o}</button>`).join('')}</div>`;
  say('cube_q');
  bindOpts(ai,`There are ${ans} cubes.`);
}

/* ---------- 7. SHAPE ANALOGIES (A : B = C : ?) ---------- */
function GAME_analogy(){
  const nT=lvl<=2?1:lvl<=4?2:lvl<=6?3:4;
  const kinds=pick(['color','fill','count','size'],nT);
  const [ca,cb,cc]=pick(COLORS,3);
  const [sa,sc]=pick(SHAPES,2);
  const A={shape:sa,color:ca,count:1+R(2),fill:Math.random()<.5,size:Math.random()<.5?1:.62};
  const C={shape:sc,color:ca,count:1+R(2),fill:Math.random()<.5,size:Math.random()<.5?1:.62};
  if(!kinds.includes('color'))C.color=Math.random()<.5?ca:cc;
  const dCount=Math.random()<.5?1:-1;
  const tf={color:o=>({...o,color:o.color===ca?cb:o.color}),fill:o=>({...o,fill:!o.fill}),
    count:o=>({...o,count:o.count+(o.count+dCount<1||o.count+dCount>4?-dCount:dCount)}),size:o=>({...o,size:o.size===1?.62:1})};
  // make count rule consistent: use the same step for A and C
  if(kinds.includes('count')){A.count=2;C.count=2}
  const apply=(o,ks)=>ks.reduce((x,k)=>tf[k](x),o);
  const B=apply(A,kinds),ans=apply(C,kinds);
  const id=o=>[o.shape,o.color,o.count,o.fill,o.size].join('|');
  const cands=new Map();
  kinds.forEach(k=>{const o=apply(C,kinds.filter(x=>x!==k));cands.set(id(o),o)});
  cands.set(id(C),C);
  const others=['color','fill','count','size'].filter(k=>!kinds.includes(k));
  others.forEach(k=>{const o=tf[k](ans);cands.set(id(o),o)});
  cands.set(id({...ans,shape:sa}),{...ans,shape:sa});
  cands.delete(id(ans));
  const n=lvl<=2?3:4;
  const options=shuf([ans,...shuf([...cands.values()]).slice(0,n-1)]);
  const ai=options.findIndex(o=>id(o)===id(ans));
  const fig=o=>cellSVG(o);
  const box='background:#f7f6ff;border-radius:14px;width:84px;height:84px;display:inline-flex;align-items:center;justify-content:center';
  const arrow='<span style="font-size:30px;color:#5a4bd1;margin:0 6px">➜</span>';
  $('#stage').innerHTML=`<div class="q">This turns into this…<br>so what does this turn into?</div>
   <div style="display:flex;align-items:center;justify-content:center;margin-bottom:8px"><span style="${box}">${fig(A)}</span>${arrow}<span style="${box}">${fig(B)}</span></div>
   <div style="display:flex;align-items:center;justify-content:center;margin-bottom:14px"><span style="${box}">${fig(C)}</span>${arrow}<span style="${box};border:3px dashed #7b6cf6;font-size:34px;color:#7b6cf6;font-weight:700">?</span></div>
   <div class="opts ${n===4?'two':''}">${options.map(o=>`<button class="opt">${fig(o)}</button>`).join('')}</div>`;
  say('analogy_q');
  const names={color:'color',fill:'filled/empty',count:'how many',size:'size'};
  bindOpts(ai,'What changed: '+kinds.map(k=>names[k]).join(' + ')+'.');
}

/* ---------- 8. PICTURE SUDOKU ---------- */
function sudokuSolutions(g,N,br,bc,limit=2){
  let count=0;const a=g.slice();
  const ok=(p,v)=>{const r=Math.floor(p/N),c=p%N;for(let i=0;i<N;i++){if(a[r*N+i]===v||a[i*N+c]===v)return false}
    const r0=r-r%br,c0=c-c%bc;for(let i=0;i<br;i++)for(let j=0;j<bc;j++)if(a[(r0+i)*N+c0+j]===v)return false;return true};
  (function go(){if(count>=limit)return;const p=a.indexOf(-1);if(p<0){count++;return}
    for(let v=0;v<N;v++)if(ok(p,v)){a[p]=v;go();a[p]=-1}})();
  return count;
}
function GAME_sudoku(){
  const big=lvl>=7, N=big?6:4, br=2, bc=big?3:2;
  const holes=[4,5,7,8,9,10,14,17][Math.min(lvl,8)-1];
  const perm=a=>shuf(a);
  const bands=perm([...Array(N/br).keys()]).flatMap(b=>perm([...Array(br).keys()]).map(r=>b*br+r));
  const stacks=perm([...Array(N/bc).keys()]).flatMap(s=>perm([...Array(bc).keys()]).map(c=>s*bc+c));
  const sym=perm([...Array(N).keys()]);
  const sol=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++){const rr=bands[r],cc=stacks[c];sol.push(sym[(bc*(rr%br)+Math.floor(rr/br)+cc)%N])}
  const g=sol.slice();
  for(const p of shuf([...Array(N*N).keys()])){if(N*N-g.filter(x=>x>=0).length>=holes)break;const v=g[p];g[p]=-1;if(sudokuSolutions(g,N,br,bc)!==1)g[p]=v}
  const ICONS=pick(['🍎','🐱','⭐','🚗','🌙','⚽','🐟','🎈','🍩','🦋'],N);
  let sel=-1,miss=0;
  const draw=()=>{
    $('#sgrid').innerHTML=g.map((v,p)=>{const r=Math.floor(p/N),c=p%N;
      const bt=r%br===0?3:1,bl=c%bc===0?3:1,bb=r===N-1?3:0,brr=c===N-1?3:0;
      return `<button class="scell${v<0?' empty':''}${p===sel?' sel':''}" data-p="${p}" style="border-width:${bt}px ${brr}px ${bb}px ${bl}px">${v>=0?ICONS[v]:''}</button>`}).join('');
    document.querySelectorAll('.scell').forEach(b=>b.onclick=()=>{const p=+b.dataset.p;if(g[p]>=0||locked)return;sel=p;beep(500,.05);draw()});
  };
  $('#stage').innerHTML=`<div class="q">Fill the grid!<br><span style="font-size:15px;color:#888">Each row, column and thick box has every picture once. Tap a square, then a picture.</span></div>
   <div id="sgrid" class="sgrid" style="grid-template-columns:repeat(${N},1fr);max-width:${N===4?260:330}px"></div>
   <div class="opts" style="grid-template-columns:repeat(${N},1fr);margin-top:12px">${ICONS.map((e,i)=>`<button class="opt spick" data-v="${i}" style="font-size:${N===4?34:26}px">${e}</button>`).join('')}</div>`;
  draw();say('sudoku_q');
  document.querySelectorAll('.spick').forEach(b=>b.onclick=()=>{
    if(locked)return;if(sel<0){$('#fb').textContent='👆 Tap an empty square first';return}
    const v=+b.dataset.v;
    if(sol[sel]===v){g[sel]=v;sel=-1;beep(700,.08);draw();$('#fb').textContent='';
      if(!g.includes(-1)){say('sudoku_win',false);result(miss===0,null,null,'Solved, but with '+miss+' mistake'+(miss>1?'s':'')+'. Try for zero!',false,true)}}
    else{miss++;nope();b.classList.add('bad');setTimeout(()=>b.classList.remove('bad'),400);$('#fb').textContent='❌ That picture is already in this row, column or box';}
  });
}

/* ---------- 9. CODE BREAKER ---------- */
function GAME_code(){
  const cfg=[[3,4,8,0],[3,4,7,0],[3,5,7,0],[3,5,6,0],[4,6,8,0],[4,6,7,0],[4,6,8,1],[4,6,7,1]][Math.min(lvl,8)-1];
  const [L,K,T,rep]=cfg;
  const PC=['#e63946','#2a9d8f','#f4a100','#5a4bd1','#f15bb5','#1d1f3a'].slice(0,K);
  const secret=rep?Array.from({length:L},()=>R(K)):pick([...Array(K).keys()],L);
  let guess=[],rows=[],done=false;
  const peg=(c,sz=34)=>`<span style="display:inline-block;width:${sz}px;height:${sz}px;border-radius:50%;background:${c===null?'#e6e4f7':PC[c]};box-shadow:inset 0 -3px 0 #0003"></span>`;
  const score=g=>{let ex=0,cl=0;const s=secret.slice(),q=g.slice();for(let i=0;i<L;i++)if(q[i]===s[i]){ex++;s[i]=q[i]=-1}
    for(let i=0;i<L;i++)if(q[i]>=0){const j=s.indexOf(q[i]);if(j>=0){cl++;s[j]=-1}}return[ex,cl]};
  const draw=()=>{
    const hist=rows.map(([g,[ex,cl]])=>`<div class="crow">${g.map(c=>peg(c,28)).join('')}<span class="fbk">${'🟢'.repeat(ex)}${'🟡'.repeat(cl)}${'⚪'.repeat(L-ex-cl)}</span></div>`).join('');
    $('#cboard').innerHTML=hist+(done?'':`<div class="crow cur">${Array.from({length:L},(_,i)=>`<button class="cslot" data-i="${i}">${peg(guess[i]??null)}</button>`).join('')}<span class="fbk" style="color:#888;font-size:14px">${rows.length+1}/${T}</span></div>`);
    document.querySelectorAll('.cslot').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(guess[i]!=null){guess.splice(i,1);beep(300,.05);draw()}});
  };
  $('#stage').innerHTML=`<div class="q">Crack the secret code! 🔐<br><span style="font-size:14px;color:#666">🟢 right color, right spot · 🟡 right color, wrong spot${rep?' · colors can repeat!':''}</span></div>
   <div id="cboard" class="cboard"></div>
   <div class="cpal">${PC.map((c,i)=>`<button class="cpick" data-c="${i}">${peg(i,40)}</button>`).join('')}</div>
   <button class="big" id="ccheck">Check ✔</button>`;
  draw();say('code_q');
  document.querySelectorAll('.cpick').forEach(b=>b.onclick=()=>{if(done||guess.length>=L)return;const c=+b.dataset.c;if(!rep&&guess.includes(c)){$('#fb').textContent='Each color only once in this level';return}guess.push(c);beep(520+c*60,.06);$('#fb').textContent='';draw()});
  $('#ccheck').onclick=()=>{
    if(done)return;if(guess.length<L){$('#fb').textContent=`Pick ${L} colors first`;return}
    const sc=score(guess);rows.push([guess,sc]);guess=[];
    if(sc[0]===L){done=true;draw();$('#ccheck').remove();say('code_win',false);result(true,null,null,null,false,true);return}
    if(rows.length>=T){done=true;draw();$('#ccheck').remove();$('#cboard').innerHTML+=`<div class="crow" style="background:#fff3c4">Code: ${secret.map(c=>peg(c,28)).join('')}</div>`;say('code_lose',false);result(false,null,null,'Out of tries! See the code above.',false,true);return}
    beep(440,.08);draw();
  };
}

/* ---------- 10. ODD ONE OUT (visual rule) ---------- */
function GAME_odd(){
  const n=lvl<=2?4:lvl<=5?5:6;
  const props=['shape','color','fill','count'];
  const P=props[R(props.length)];
  // how many other attributes vary (more = harder to see the shared rule)
  const vary=props.filter(p=>p!==P);const nv=Math.min(vary.length,lvl<=2?1:lvl<=4?2:3);
  const varying=pick(vary,nv);
  const base={shape:pick(SHAPES,1)[0],color:pick(COLORS,1)[0],fill:true,count:1+R(3)};
  const pools={shape:SHAPES,color:COLORS,fill:[true,false],count:[1,2,3]};
  // every varying value appears at least twice, so only the rule-breaker stands alone
  const all=Array.from({length:n},()=>({...base}));
  varying.forEach(k=>{const vals=pick(pools[k],Math.max(1,Math.floor(n/2)));const arr=[];vals.forEach(v=>arr.push(v,v));while(arr.length<n)arr.push(vals[R(vals.length)]);shuf(arr).forEach((v,i)=>all[i][k]=v)});
  const ai=R(n);const alts=pools[P].filter(v=>v!==base[P]);all[ai][P]=alts[R(alts.length)];

  const ruleTxt={shape:'All the others are the same shape.',color:'All the others are the same color.',fill:'All the others are '+(base.fill?'filled in.':'empty.'),count:`All the others have ${base.count}.`};
  $('#stage').innerHTML=`<div class="q">Which one does not belong? 🕵️</div><div class="opts" style="grid-template-columns:repeat(${n<=4?2:3},1fr)">${all.map(o=>`<button class="opt">${cellSVG(o)}</button>`).join('')}</div>`;
  say('odd_q');bindOpts(ai,ruleTxt[P]);
}

/* ---------- 11. QUICK MATH (mental chain) ---------- */
function GAME_math(){
  const steps=lvl<=2?1:lvl<=4?2:lvl<=6?3:4;const maxN=lvl<=2?5:lvl<=4?9:lvl<=6?12:20;
  let v=1+R(maxN),txt=''+v;
  for(let i=0;i<steps;i++){
    const ops=lvl>=5?['+','-','×']:['+','-'];let op=ops[R(ops.length)],x;
    if(op==='×'){x=2+R(lvl>=7?4:2);if(v*x>99){op='+'}}
    if(op==='+'){x=1+R(maxN);v+=x}else if(op==='-'){x=1+R(Math.max(1,Math.min(maxN,v)));if(x>v)x=v;v-=x}else v*=x;
    txt+=` ${op} ${x}`;
  }
  const ans=v;const s=new Set([ans]);for(const d of shuf([1,-1,2,-2,10,-10,3])){if(s.size>=4)break;if(ans+d>=0)s.add(ans+d)}
  const options=shuf([...s]);const ai=options.indexOf(ans);
  $('#stage').innerHTML=`<div class="q">Quick! Solve it in your head ⚡${lvl>=5?'<br><span style="font-size:14px;color:#888">Go left to right, step by step</span>':''}</div><div class="seq"><span style="font-size:30px;padding:12px 18px">${txt} = ?</span></div><div class="opts two">${options.map(o=>`<button class="opt">${o}</button>`).join('')}</div>`;
  say('math_q');bindOpts(ai,`${txt} = ${ans}`);
}

/* ---------- 12. ROBOT PATH (follow the arrows) ---------- */
function GAME_path(){
  const N=lvl<=2?3:lvl<=5?4:5;const moves=lvl<=1?2:lvl<=2?3:lvl<=4?4:lvl<=6?6:8;
  const D={'⬆️':[-1,0],'⬇️':[1,0],'⬅️':[0,-1],'➡️':[0,1]};
  let r=R(N),c=R(N);const sr=r,sc=c;const seq=[];
  for(let i=0;i<moves;i++){const ok=Object.keys(D).filter(k=>{const[dr,dc]=D[k];return r+dr>=0&&r+dr<N&&c+dc>=0&&c+dc<N});const k=ok[R(ok.length)];seq.push(k);r+=D[k][0];c+=D[k][1]}
  const end=r*N+c;
  const hide=lvl>=7; // extreme: arrows disappear, remember them!
  $('#stage').innerHTML=`<div class="q">Follow the arrows 🤖<br><span style="font-size:15px;color:#888">Where does the robot stop? Tap the square.</span></div>
   <div class="seq" id="arrows" style="gap:4px">${seq.map(k=>`<span style="font-size:26px;padding:6px 8px">${k}</span>`).join('')}</div>
   <div class="pgrid" style="grid-template-columns:repeat(${N},1fr);max-width:${N*68}px">${Array.from({length:N*N},(_,p)=>`<button class="opt pcell" style="min-height:${N>4?52:62}px;font-size:30px">${p===sr*N+sc?'🤖':''}</button>`).join('')}</div>`;
  say('path_q');
  if(hide)setTimeout(()=>{const a=$('#arrows');if(a)a.innerHTML='<span style="font-size:18px">🙈 Arrows hidden — use your memory!</span>'},2500+moves*500);
  curAns=end;const bs=[...document.querySelectorAll('.pcell')];
  bs.forEach((b,i)=>b.onclick=()=>{bs[end].textContent='🏁';result(i===end,b,bs[end],'The robot stops at the 🏁 square.')});
}

const GAMES={matrix:GAME_matrix,rotate:GAME_rotate,numbers:GAME_numbers,balance:GAME_balance,simon:GAME_simon,
  cube:GAME_cube,analogy:GAME_analogy,sudoku:GAME_sudoku,code:GAME_code,odd:GAME_odd,math:GAME_math,path:GAME_path};

/* ---------- PLAYER NAME + HIGH SCORES (per level, saved on this device) ---------- */
const GNAME={matrix:'Matrix Puzzles',rotate:'Shape Rotation',numbers:'Number Patterns',balance:'Balance Scale',simon:'Memory Lights',cube:'Cube Count',analogy:'Shape Analogies',sudoku:'Picture Sudoku',code:'Code Breaker',odd:'Odd One Out',math:'Quick Math',path:'Robot Path',mix:'IQ Test Mix'};

function askName(){$('#home').classList.add('hidden');$('#game').classList.add('hidden');$('#namescr').classList.remove('hidden');$('#nameinput').value=PLAYER;setTimeout(()=>{try{$('#nameinput').focus()}catch(e){}},100)}
function setName(){const n=$('#nameinput').value.trim().slice(0,14);if(!n){$('#namefb').textContent='Please write your name first ✍️';return}
  PLAYER=n;try{localStorage.setItem('bcName',n)}catch(e){}$('#pname').textContent=n;$('#namescr').classList.add('hidden');$('#home').classList.remove('hidden');beep(660);beep(880,.2);say('pick_level',false)}
$('#namego').onclick=setName;$('#nameinput').addEventListener('keydown',e=>{if(e.key==='Enter')setName()});
$('#pchange').onclick=askName;
if(PLAYER){$('#pname').textContent=PLAYER;$('#home').classList.remove('hidden')}else askName();

function loadHS(){try{const a=JSON.parse(localStorage.getItem('bcHS4')||'null');if(a&&a.length===4)return a}catch(e){}return[[],[],[],[]]}
function saveHS(a){try{localStorage.setItem('bcHS4',JSON.stringify(a))}catch(e){}}
let lastEntry=null;
function hsOffer(){ // saves automatically under the player's name, in this level's board
  if(!correct)return;
  const pct=Math.round(correct/TOTAL*100);
  const all=loadHS(),board=all[D];
  const e={name:PLAYER||'Player',game:G,score:`${correct}/${TOTAL}`,pct,t:Date.now(),date:new Date().toLocaleDateString('en-GB')};
  board.push(e);board.sort((x,y)=>y.pct-x.pct||x.t-y.t);all[D]=board.slice(0,10);saveHS(all);
  const rank=all[D].findIndex(x=>x.t===e.t);

  $('#stage').appendChild(box);$('#seehs').onclick=()=>showHS(D);
  if(rank<3){setTimeout(()=>say('hs_new',false),1600);confetti()}
}

   <div class="q">🏆 ${DIFFS[tab].n} — Top 10</div>`+
   (a.length?`<table class="hs"><tr><th>#</th><th>Name</th><th>Game</th><th>Score</th></tr>${a.map((e,i)=>`<tr class="${e.t===lastEntry?'me':''}"><td>${medal(i)}</td><td><b>${e.name.replace(/</g,'')}</b></td><td style="font-size:13px">${GNAME[e.game]||e.game}</td><td><b>${e.pct}%</b><br><span style="font-size:11px;color:#888">${e.score}</span></td></tr>`).join('')}</table>`

}
